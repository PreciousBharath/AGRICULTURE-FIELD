<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — AgriPredict</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/agri.css') }}">
</head>
<body>

  <div class="bg-canvas"></div>

  <nav class="agri-nav">
    <a href="{{ url_for('index') }}" class="nav-brand">
      <div class="nav-brand-icon">🌾</div>
      <span class="nav-brand-text">AgriPredict</span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" class="nav-link">Home</a>
      <a href="{{ url_for('predict') }}" class="nav-link">Predict</a>
      <a href="{{ url_for('login') }}" class="nav-link">Login</a>
    </div>
    <a href="{{ url_for('login') }}" class="nav-btn">Sign In</a>
  </nav>

  <div class="page-wrapper">
    <div class="agri-card fade-up" style="max-width: 500px;">

      <div class="card-header-agri">
        <div class="card-icon">🌱</div>
        <h1 class="card-title">Join AgriPredict</h1>
        <p class="card-subtitle">Create your free account and start predicting crop yields today</p>
      </div>

      <div class="agri-divider"></div>

      {% if error %}
      <div class="alert-agri">⚠️ {{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('signup') }}">

        <!-- Name Row -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem;">
          <div class="form-group">
            <label class="form-label" for="first_name">👤 First Name</label>
            <input type="text" class="form-control" id="first_name" name="first_name"
                   placeholder="Ravi" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="last_name">👤 Last Name</label>
            <input type="text" class="form-control" id="last_name" name="last_name"
                   placeholder="Kumar" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">📧 Email Address</label>
          <div class="input-group">
            <span class="input-icon">📧</span>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">📱 Phone Number (optional)</label>
          <div class="input-group">
            <span class="input-icon">📱</span>
            <input type="tel" class="form-control" id="phone" name="phone"
                   placeholder="+91 98765 43210">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="state">📍 State / Region</label>
          <select class="form-control" id="state" name="state">
            <option value="">— Select your State —</option>
            <option>Andhra Pradesh</option>
            <option>Bihar</option>
            <option>Chhattisgarh</option>
            <option>Gujarat</option>
            <option>Haryana</option>
            <option>Jharkhand</option>
            <option>Karnataka</option>
            <option>Kerala</option>
            <option>Madhya Pradesh</option>
            <option>Maharashtra</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Rajasthan</option>
            <option>Tamil Nadu</option>
            <option>Telangana</option>
            <option>Uttar Pradesh</option>
            <option>West Bengal</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">🔑 Password</label>
          <div class="input-group input-group-pass">
            <span class="input-icon">🔑</span>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Min. 8 characters" style="padding-left: 2.5rem;" required minlength="8"
                   oninput="checkStrength(this.value)">
            <button type="button" class="pass-toggle" onclick="togglePassword('password', this)" title="Show/hide">👁️</button>
          </div>
          <!-- Strength bar -->
          <div style="margin-top: 0.4rem; display: flex; gap: 3px;">
            <div class="strength-seg" id="s1" style="height:3px; flex:1; border-radius:2px; background: #ddd; transition: background 0.3s;"></div>
            <div class="strength-seg" id="s2" style="height:3px; flex:1; border-radius:2px; background: #ddd; transition: background 0.3s;"></div>
            <div class="strength-seg" id="s3" style="height:3px; flex:1; border-radius:2px; background: #ddd; transition: background 0.3s;"></div>
            <div class="strength-seg" id="s4" style="height:3px; flex:1; border-radius:2px; background: #ddd; transition: background 0.3s;"></div>
          </div>
          <div id="strength-label" style="font-size: 0.76rem; color: var(--bark); margin-top: 0.2rem; opacity: 0.7;"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">🔒 Confirm Password</label>
          <div class="input-group input-group-pass">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                   placeholder="Re-enter your password" style="padding-left: 2.5rem;" required
                   oninput="checkMatch()">
            <button type="button" class="pass-toggle" onclick="togglePassword('confirm_password', this)" title="Show/hide">👁️</button>
          </div>
          <div id="match-msg" style="font-size: 0.76rem; margin-top: 0.2rem;"></div>
        </div>

        <label class="agri-check">
          <input type="checkbox" name="terms" required>
          <span class="agri-check-label">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </span>
        </label>

        <label class="agri-check">
          <input type="checkbox" name="newsletter">
          <span class="agri-check-label">
            Send me crop tips, seasonal alerts &amp; AgriPredict updates 🌾
          </span>
        </label>

        <div style="margin-top: 1.2rem;">
          <button type="submit" class="btn-agri-primary">
            🌱 Create My Account
          </button>
        </div>

      </form>

      <div class="auth-switch">
        Already have an account? <a href="{{ url_for('login') }}">Sign in →</a>
      </div>

    </div>
  </div>

  <footer class="agri-footer">
    © 2026 AgriPredict — Free forever for Indian Farmers 🇮🇳
  </footer>

  <script>
    function togglePassword(fieldId, btn) {
      const field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
      btn.textContent = field.type === 'password' ? '👁️' : '🙈';
    }

    function checkStrength(val) {
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const colors = ['', '#e53e3e', '#f5a623', '#a8d96c', '#4a7c3f'];
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong 💪'];

      for (let i = 1; i <= 4; i++) {
        document.getElementById('s' + i).style.background = i <= score ? colors[score] : '#e2e8f0';
      }
      document.getElementById('strength-label').textContent = val.length > 0 ? labels[score] : '';
      document.getElementById('strength-label').style.color = colors[score];
    }

    function checkMatch() {
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('confirm_password').value;
      const msg = document.getElementById('match-msg');
      if (p2.length === 0) { msg.textContent = ''; return; }
      if (p1 === p2) {
        msg.textContent = '✅ Passwords match';
        msg.style.color = '#4a7c3f';
      } else {
        msg.textContent = '❌ Passwords do not match';
        msg.style.color = '#e53e3e';
      }
    }
  </script>
</body>
</html>
